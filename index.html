<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailer Chassis Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1420;
    --panel:#10233A;
    --rule:#1C3A56;
    --text:#E7EEF5;
    --muted:#8FA6BC;
    --accent:#7FB3E0;
    --amber:#D98E2B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg),var(--bg)),
      repeating-linear-gradient(0deg, rgba(127,179,224,0.05) 0, rgba(127,179,224,0.05) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(127,179,224,0.05) 0, rgba(127,179,224,0.05) 1px, transparent 1px, transparent 32px);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:520px;
    position:relative;
    padding:26px;
  }
  .logo-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding:14px 18px;
    background:#F4F6F8;
    border-radius:3px;
    border:1px solid var(--rule);
  }
  .logo-bar img{
    display:block;
    height:34px;
    width:auto;
    object-fit:contain;
  }
  .logo-bar .trailer-logo{
    height:44px;
  }
  .corner{
    position:absolute;
    width:22px;
    height:22px;
    border:2px solid var(--accent);
    opacity:0.85;
  }
  .corner.tl{top:0;left:0;border-right:none;border-bottom:none;}
  .corner.tr{top:0;right:0;border-left:none;border-bottom:none;}
  .corner.bl{bottom:0;left:0;border-right:none;border-top:none;}
  .corner.br{bottom:0;right:0;border-left:none;border-top:none;}

  .card{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:32px 28px 28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0 0 4px;
    color:var(--text);
  }
  .company-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .company-link a{color:var(--accent); text-decoration:none;}
  .company-link a:hover{text-decoration:underline;}

  .rule{
    border:none;
    border-top:1px solid var(--rule);
    margin:20px 0;
  }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 4px;
  }
  .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    font-weight:500;
    color:var(--text);
    word-break:break-word;
  }
  .value.big{font-size:20px; font-weight:600; letter-spacing:0.01em;}

  .section-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";
    width:6px;height:6px;
    background:var(--amber);
    display:inline-block;
  }

  .contact{
    padding:12px 0;
    border-top:1px solid var(--rule);
  }
  .contact:first-of-type{border-top:none; padding-top:0;}
  .contact-name{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    margin:0 0 2px;
  }
  .contact-role{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 5px;
  }
  .contact-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--accent);
    display:flex;
    flex-wrap:wrap;
    gap:4px 14px;
  }
  .contact-meta a{color:var(--accent); text-decoration:none;}
  .contact-meta a:hover{text-decoration:underline;}

  .footer-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:22px;
    letter-spacing:0.04em;
  }

  .index-list{
    list-style:none; padding:0; margin:0;
    display:grid; gap:8px;
  }
  .index-list a{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--rule);
    padding:10px 12px;
    text-decoration:none;
  }
  .index-list a:hover{border-color:var(--accent); color:var(--accent);}

  .not-found{
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
  }
</style>
</head>

    </div>
    <div class="card" id="card">
      <!-- populated by JS -->
    </div>
    <div class="footer-note">AXISCADES DEFENCE SYSTEMS &mdash; TRAILER CHASSIS RECORD</div>
  </div>

<script>
const PLANT_ADDRESS = "PRV7+XR, Rohad, Haryana 124501";
const COMPANY_LINK = "https://www.axiscades.com/";
const CONTACTS = [
  {name:"Vivek G Menon", role:"Sr VP Defence Systems", email:"vivekg.menon@axis.aero", phone:""},
  {name:"Anantha PG", role:"DGM", email:"anantha.pg@axis.aero", phone:"+91 9448681683"},
  {name:"Anoop Shriyan", role:"Sr Engineer", email:"anoop@axis.aero", phone:"+91 8433880767"},
  {name:"Rohan Francis", role:"Junior Engineer", email:"rohan.f@axis.aero", phone:"+91 8147036816"}
];

function buildRecords(){
  const rows = [];
  for(let i=1;i<=16;i++){
    rows.push({sno:i, chassis:`AXCTRAT50HA${(26000+i).toString().padStart(5,'0')}`, date:"JANUARY 2026"});
  }
  for(let i=17;i<=20;i++){
    rows.push({sno:i, chassis:`AXCTRAT50HB${(26000+i).toString().padStart(5,'0')}`, date:"FEBRUARY 2026"});
  }
  return rows;
}
const RECORDS = buildRecords();

function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function renderContacts(){
  return CONTACTS.map(c => `
    <div class="contact">
      <div class="contact-name">${esc(c.name)}</div>
      <div class="contact-role">${esc(c.role)}</div>
      <div class="contact-meta">
        <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>
        ${c.phone ? `<a href="tel:${esc(c.phone.replace(/\s+/g,''))}">${esc(c.phone)}</a>` : ''}
      </div>
    </div>
  `).join('');
}

function renderRecord(rec){
  document.getElementById('card').innerHTML = `
    <p class="eyebrow">Trailer Chassis Dossier</p>
    <h1>Chassis Record</h1>
    <p class="company-link"><a href="${COMPANY_LINK}" target="_blank" rel="noopener">${COMPANY_LINK}</a></p>
    <hr class="rule">
    <div class="field">
      <p class="label">Chassis No.</p>
      <p class="value big">${esc(rec.chassis)}</p>
    </div>
    <div class="field">
      <p class="label">Date of Manufacturing</p>
      <p class="value">${esc(rec.date)}</p>
    </div>
    <div class="field">
      <p class="label">Plant Address</p>
      <p class="value">${esc(PLANT_ADDRESS)}</p>
    </div>
    <hr class="rule">
    <p class="section-title">Contact in Case of Service</p>
    ${renderContacts()}
  `;
}

function renderIndex(){
  const items = RECORDS.map(r => `<li><a href="?id=${encodeURIComponent(r.chassis)}">S.No ${r.sno} — ${esc(r.chassis)}</a></li>`).join('');
  document.getElementById('card').innerHTML = `
    <p class="eyebrow">Trailer Chassis Dossier</p>
    <h1>All Records</h1>
    <p class="company-link"><a href="${COMPANY_LINK}" target="_blank" rel="noopener">${COMPANY_LINK}</a></p>
    <hr class="rule">
    <ul class="index-list">${items}</ul>
  `;
}

function renderNotFound(id){
  document.getElementById('card').innerHTML = `
    <p class="eyebrow">Trailer Chassis Dossier</p>
    <h1>Record Not Found</h1>
    <hr class="rule">
    <p class="not-found">No record matches chassis ID "${esc(id)}".<br><br>
    <a href="?" style="color:var(--accent);">View all records &rarr;</a></p>
  `;
}

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
if(!id){
  renderIndex();
}else{
  const rec = RECORDS.find(r => r.chassis === id.toUpperCase());
  if(rec) renderRecord(rec);
  else renderNotFound(id);
}
</script>
